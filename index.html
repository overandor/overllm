const PAGES=[{"id":"home","nav":"Home","kicker":"REPRODUCIBLE AGENT RUNTIME","title":"AI work you<br>can <span class='accent'>prove.</span>","body":"Preserve context, execution, changes, tests, telemetry, receipts, and declared limitations around every model action.","next":"runtime"},{"id":"runtime","nav":"Runtime","kicker":"01 / RUNTIME TRUTH","title":"See what is<br>actually running.","body":"Inspect backend state, loaded components, and environment-dependent capabilities.","endpoint":"/status","cards":[["LOCAL-FIRST","Workstation runtime","Local models and tools remain close to the machine."],["TRUTH LABELS","Partial means partial","Unwired components do not masquerade as production systems."],["REPLACEABLE","Models can change","The evidence protocol survives the model."]]},{"id":"receipts","nav":"Receipts","kicker":"02 / EVIDENCE LEDGER","title":"Work becomes<br>a receipt.","body":"Inspect tamper-evident records connecting inputs, outputs, hashes, and verification state.","endpoint":"/finance/receipts?limit=20","cards":[["HASH CHAIN","Ordered evidence","Each record preserves its relationship to prior state."],["SIGNATURE","Configured honestly","Unsigned local hashes remain labeled unsigned."],["EXPORT","Reviewable records","Evidence can move into diligence workflows."]]},{"id":"fingerprint","nav":"Fingerprint","kicker":"03 / RSTF","title":"Different bytes.<br>Recoverable message.","body":"Compute a reversible semantic transform fingerprint for supported presentation transforms.","endpoint":"/fingerprint/compute","input":true,"bodyKey":"text","placeholder":"Paste reversed, flipped, bidi, or homoglyph text…","cards":[["RAW HASH","Exact bytes","Cryptographic identity remains unchanged."],["CANONICAL HASH","Recovered message","Known transforms can resolve to a shared canonical form."],["HEURISTIC","Scoped honestly","Curated tables are not exhaustive Unicode analysis."]]},{"id":"finance","nav":"Evidence","kicker":"04 / FINANCEABLE EVIDENCE","title":"Diligence without<br>invented value.","body":"Read evidence, monetization, and reproducibility summaries from recorded ledger state.","endpoint":"/finance/summary","cards":[["RECEIPTS","Work evidence","Count and inspect recorded work units."],["REVENUE","Linked events","Real events may connect to receipts and contracts."],["DISCLAIMER","Not valuation","Evidence does not guarantee financing or appraisal."]]},{"id":"markets","nav":"Telemetry","kicker":"05 / PUBLIC DATA SURFACE","title":"Live when live.<br>Silent when not.","body":"Inspect public paper-mode market data and runtime availability without invented fallback values.","endpoint":"/gate/markets","cards":[["PUBLIC DATA","Gate.io futures","Live only when the fetch succeeds."],["PAPER MODE","Trading disabled","The public surface does not place orders."],["FAILURE STATE","No decorative numbers","Unavailable dependencies remain visibly unavailable."]]}];const API_KEY='overllm_api';const DEFAULT_API='https://overllm-alpha.onrender.com/api';
const app=document.getElementById('app');const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function api(){return localStorage.getItem(API_KEY)||DEFAULT_API}function route(){return location.hash.slice(1)||'home'}function nav(id){location.hash=id}
async function call(path,opts){const out=$('#output');if(out)out.textContent='Requesting '+api()+path+' …';try{const r=await fetch(api()+path,opts);const text=await r.text();let v;try{v=JSON.parse(text)}catch{v=text}if(out)out.textContent=JSON.stringify(v,null,2);const dot=$('#liveDot');if(dot)dot.classList.toggle('live',r.ok)}catch(e){if(out)out.textContent='Unavailable: '+e.message+'\n\nCheck the API base, deployment state, and CORS policy.'}}
function cards(items){return '<div class="grid">'+items.map(x=>'<article class="card"><div class="mono">'+esc(x[0])+'</div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>'}
function consoleBox(page){return '<div class="console"><div class="consolebar"><span>'+esc(page.endpoint||'API CONSOLE')+'</span><span class="status"><i class="dot" id="liveDot"></i> LIVE WHEN AVAILABLE</span></div><div class="consolebody">'+(page.input?'<div class="form"><textarea id="payload" class="input" rows="4" placeholder="'+esc(page.placeholder||'Enter text')+'"></textarea><button class="btn primary" id="run">Run endpoint →</button></div><pre id="output" style="margin-top:18px">Ready.</pre>':'<button class="btn primary" id="run">Fetch live endpoint →</button><pre id="output" style="margin-top:18px">Ready.</pre>')+'</div></div>'}
function render(){const id=route();const p=PAGES.find(x=>x.id===id)||PAGES[0];document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p.id));if(p.id==='home'){app.innerHTML='<section class="shell hero"><div><div class="eyebrow">'+esc(p.kicker)+'</div><h1>'+p.title+'</h1><p class="lead">'+esc(p.body)+'</p><div class="actions"><button class="btn primary" data-go="'+esc(p.next)+'">Enter the system →</button><a class="btn" href="https://github.com/overandor/overllm">Inspect source ↗</a></div></div><div class="art" aria-label="OverLLM visual artwork"></div></section>';document.querySelector('[data-go]').onclick=e=>nav(e.currentTarget.dataset.go);return}app.innerHTML='<section class="shell"><div class="pagehead"><div class="eyebrow">'+esc(p.kicker)+'</div><h2>'+p.title+'</h2><p class="lead">'+esc(p.body)+'</p></div><div class="content">'+cards(p.cards)+consoleBox(p)+'</div></section>';$('#run').onclick=()=>{let opts;if(p.input){opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p.bodyKey?{[p.bodyKey]:$('#payload').value}:{text:$('#payload').value})}}call(p.endpoint,opts)}}
document.querySelectorAll('[data-page]').forEach(a=>a.onclick=()=>nav(a.dataset.page));window.addEventListener('hashchange',render);render();
</script></body></html>
