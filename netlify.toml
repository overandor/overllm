# Render remains the primary app target in render.yaml.
# Netlify additionally exposes the RSTF serverless function for deploy previews.
[build]
  publish = "ui/dist"
  command = "npm test && cd ui && npm install && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/rstf"
  to = "/.netlify/functions/rstf"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
