name: production-hardening

on:
  push:
    branches:
      - main
      - prod/**
      - docs/**
      - feat/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-agent:
    name: Go agent compile/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum
      - name: Check Go modules
        working-directory: go
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Test Go packages
        working-directory: go
        run: go test ./...

  rust-telemetry:
    name: Rust telemetry compile/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test telemetry crate
        working-directory: rust
        run: cargo test --all-targets

  overml:
    name: OverML package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test OverML
        working-directory: lang/overml
        run: cargo test --all-targets

  cpp-engine:
    name: C++ engine build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ engine
        run: cmake --build cpp/build --config Release --parallel

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install UI dependencies
        working-directory: ui
        run: npm install
      - name: Build UI
        working-directory: ui
        run: npm run build

  python-api:
    name: Python API import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then python -m pip install -r api/requirements.txt; fi
      - name: Import API module
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('overllm_api', 'api/main.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print('api/main.py imported')
          PY
