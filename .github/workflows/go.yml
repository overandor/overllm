name: Go Agent Tests

# The Go agent (telemetry ingestion, generation, proof/venture/overagent
# routes) had no CI at all before this: a broken import (missing
# pkg/localmodel) shipped straight to main because nothing ever ran
# `go build`. This workflow exists specifically so that class of regression
# is caught on every PR, not discovered by manual audit later.

on:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  push:
    branches:
      - main
    paths:
      - "go/**"
      - ".github/workflows/go.yml"

jobs:
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v
