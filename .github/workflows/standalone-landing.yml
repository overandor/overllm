name: Deploy standalone landing page

on:
  push:
    branches: [main]
    paths:
      - "standalone-landing/**"
      - ".github/workflows/standalone-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: standalone-landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone-landing
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
