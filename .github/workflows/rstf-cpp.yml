name: RSTF C++ Package

on:
  push:
    paths:
      - 'cpp/rstf/**'
      - '.github/workflows/rstf-cpp.yml'
  pull_request:
    paths:
      - 'cpp/rstf/**'
      - '.github/workflows/rstf-cpp.yml'

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S cpp/rstf -B cpp/rstf/build -DOVERLLM_RSTF_BUILD_TESTS=ON

      - name: Build
        run: cmake --build cpp/rstf/build --config Release

      - name: Test
        run: ctest --test-dir cpp/rstf/build --output-on-failure
