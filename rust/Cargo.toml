[package]
name = "overllm-telemetry"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
libc = "0.2"

# Vector Search (HNSW)
hnsw_rs = "0.1"
ndarray = "0.15"
rand = "0.8"

# DAG / Graph
petgraph = "0.6"

# Blockchain
ethers = "2.0"
alloy = { version = "0.3", features = ["full"] }

# PDF / Article parsing
pdf-extract = "0.7"
lopdf = "0.32"

# Meta-LLM client
async-openai = "0.26"

# Utility
regex = "1.10"
md5 = "0.7"
urlencoding = "2.1"
hex = "0.4"
